<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trainers - Gym Management System</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <h1>Gym Management System</h1>
    </header>

    <nav>
        <a href="index.html">Dashboard</a>
        <a href="members.html">Members</a>
        <a href="plans.html">Membership Plans</a>
        <a href="trainers.html">Trainers</a>
        <a href="attendance.html">Attendance</a>
        <a href="payments.html">Payments</a>
    </nav>

    <main>

        <h2>Trainers Management</h2>

        <!-- Trainer Form -->
        <section class="form-section">

            <h3>Add Trainer</h3>

            <form id="trainerForm">

                <input type="hidden" id="trainer_id">

                <input
                    type="text"
                    id="trainer_name"
                    placeholder="Trainer Name"
                    required
                >

                <input
                    type="text"
                    id="phone"
                    placeholder="Phone"
                >

                <input
                    type="email"
                    id="email"
                    placeholder="Email"
                >

                <input
                    type="text"
                    id="specialization"
                    placeholder="Specialization"
                >

                <button type="submit">
                    Save Trainer
                </button>

                <button type="button" id="cancelBtn">
                    Cancel
                </button>

            </form>

        </section>

        <!-- Search -->
        <section class="search-section">

            <input
                type="text"
                id="searchInput"
                placeholder="Search trainers..."
            >

        </section>

        <!-- Trainers Table -->
        <section>

            <table>

                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Trainer Name</th>
                        <th>Phone</th>
                        <th>Email</th>
                        <th>Specialization</th>
                        <th>Actions</th>
                    </tr>
                </thead>

                <tbody id="trainersTableBody">
                    <!-- Trainers will be loaded here -->
                </tbody>

            </table>

        </section>

    </main>

    <script src="js/trainers.js"></script>

</body>
</html>
